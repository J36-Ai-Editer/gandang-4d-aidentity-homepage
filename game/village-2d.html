<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간당마을 · 잠시 쉬어가는 곳</title></head>
<body>
<main id="village" aria-label="간당마을 게임">
  <div class="world-shell"><canvas id="world" width="1280" height="720" tabindex="0" aria-label="길을 눌러 이동하는 한국 마을"></canvas>
    <header class="world-top"><div class="village-name"><span class="home-symbol" aria-hidden="true">⌂</span><div><strong>간당마을</strong><small>잠시 쉬어가는 곳</small></div></div><button id="settings" aria-label="도움말과 설정">☷</button></header>
    <div id="loading" role="status">마을 문을 여는 중…</div>
    <div class="quest-note"><small>마을의 작은 부탁</small><span id="quest-label">마을지기에게 인사해 보세요</span></div>
    <div id="toast" role="status" aria-live="polite">길을 누르면 걸어갑니다. 방향키와 WASD로도 움직일 수 있어요.</div>
    <button id="talk" class="talk-button" hidden>마을지기와 이야기 · E</button>
    <div id="placement-actions" hidden><button id="place-confirm">여기에 놓기</button><button id="place-cancel">취소</button></div>
    <nav class="dock" aria-label="마을 메뉴">
      <button id="bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Zm3 0V5a4 4 0 0 1 8 0v3"/></svg><span>가방</span></button>
      <button id="decorate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3-6 4 3 5 3-2v11h8V10l3 2 3-5-6-4c-1 3-7 3-8 0Z"/></svg><span>꾸미기</span></button>
      <button id="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Zm6-2v16m6-14v16"/></svg><span>지도</span></button>
    </nav>
    <section id="dialogue" aria-label="마을지기 대화" hidden><div><small>마을지기 · 솔이</small><p id="dialogue-text"></p></div><button id="dialogue-next">알겠어요</button></section>
    <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden><header><h2 id="sheet-title"></h2><button id="sheet-close" aria-label="메뉴 닫기">×</button></header><div id="sheet-body"></div></section>
  </div>
  <nav class="touch-pad" aria-label="화면 이동 버튼"><button data-dir="up" aria-label="위로 이동">↑</button><button data-dir="left" aria-label="왼쪽으로 이동">←</button><button data-dir="down" aria-label="아래로 이동">↓</button><button data-dir="right" aria-label="오른쪽으로 이동">→</button></nav>
  <p class="play-help">길을 눌러 이동 · 방향키 / WASD · 가까이에서 E로 대화 <span>이 기기에 마을이 저장됩니다</span></p>
  <output id="game-state" class="sr-only" aria-live="off"></output>
</main><script type="module" src="/src/scene.ts"></script>
</body></html>
